version: '3.3'

services:

  frontend:
    container_name: frontend
    build: ../frontend
    volumes:
      - ../frontend/:/app/result_build/

  db:
    container_name: database
    image: postgres:13.0-alpine
    volumes:
      - postgres_db:/app/var/lib/postgresql/data/
    env_file:
      - ./.env

  backend:
    container_name: backend
    build: ../backend
    restart: always
    volumes:
      - static_dir:/app/static/
      - media_dir:/app/media/
    depends_on:
      - db
    env_file:
      - ./.env

  nginx:
    container_name: nginx
    image: nginx:1.19.3
    ports:
      - 80:80
    volumes:
      - ../frontend/build:/usr/share/nginx/html/

      - ./nginx.conf:/etc/nginx/conf.d/default.conf

      - static_dir:/var/html/static/

      - media_dir:/var/html/media/

    depends_on:
      - backend
      - frontend

volumes:
  static_dir:
  media_dir:
  postgres_db:
